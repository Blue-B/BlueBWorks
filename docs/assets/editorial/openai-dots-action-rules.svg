<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">OpenAI dots의 행동 규칙 네 단계</title>
<desc id="desc">읽기·분석·초안 작성은 스스로 진행한다. 메시지 전송과 파일 공유는 정보와 수신자 범위에 대한 허가가 필요하다. 영구 삭제, 출처를 모르는 소프트웨어 설치, 보안 접근 권한 부여, 저장된 카드로 구매는 확인이 필요하다. 비밀번호 변경과 계좌 간 송금은 사용자가 직접 한다.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="100" y="92" font-size="42" font-weight="700" fill="#111827">dots가 혼자 해도 되는 일과 사람이 해야 하는 일</text>
<text x="100" y="138" font-size="24" fill="#4b5563">OpenAI의 dots 안전·보안·개인정보 설명 글을 BlueBWorks가 네 단계로 정리</text>

<rect x="80" y="200" width="340" height="520" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
<text x="110" y="255" font-size="28" font-weight="700" fill="#065f46">스스로 진행</text>
<text x="110" y="310" font-size="22" fill="#334155">접근 권한 안의</text>
<text x="110" y="342" font-size="22" fill="#334155">정보 읽기·분석</text>
<text x="110" y="394" font-size="22" fill="#334155">대화 안에서</text>
<text x="110" y="426" font-size="22" fill="#334155">초안 작성</text>
<text x="110" y="478" font-size="22" fill="#334155">선제적 리서치</text>
<text x="110" y="510" font-size="22" fill="#334155">(읽기 전용)</text>

<rect x="450" y="200" width="340" height="520" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
<text x="480" y="255" font-size="28" font-weight="700" fill="#1e3a8a">수신자 허가 필요</text>
<text x="480" y="310" font-size="22" fill="#334155">메시지 보내기</text>
<text x="480" y="342" font-size="22" fill="#334155">파일 공유</text>
<text x="480" y="394" font-size="22" fill="#334155">건강 데이터: 수신자</text>
<text x="480" y="426" font-size="22" fill="#334155">이름을 직접 지정</text>
<text x="480" y="478" font-size="22" fill="#334155">이메일·전화번호:</text>
<text x="480" y="510" font-size="22" fill="#334155">수신자 범주 지정</text>

<rect x="820" y="200" width="340" height="520" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
<text x="850" y="255" font-size="28" font-weight="700" fill="#92400e">매번 확인 필요</text>
<text x="850" y="310" font-size="22" fill="#334155">데이터 영구 삭제</text>
<text x="850" y="362" font-size="22" fill="#334155">출처를 모르는</text>
<text x="850" y="394" font-size="22" fill="#334155">소프트웨어 설치·실행</text>
<text x="850" y="446" font-size="22" fill="#334155">보안에 민감한</text>
<text x="850" y="478" font-size="22" fill="#334155">접근 권한 부여</text>
<text x="850" y="530" font-size="22" fill="#334155">저장된 카드로 구매</text>
<text x="850" y="562" font-size="22" fill="#334155">(승인 필요)</text>

<rect x="1190" y="200" width="330" height="520" rx="20" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
<text x="1220" y="255" font-size="28" font-weight="700" fill="#7f1d1d">사용자가 직접</text>
<text x="1220" y="310" font-size="22" fill="#334155">비밀번호 변경</text>
<text x="1220" y="362" font-size="22" fill="#334155">금융 계좌 간 송금</text>
<text x="1220" y="414" font-size="22" fill="#334155">dot은 준비만 돕고</text>
<text x="1220" y="446" font-size="22" fill="#334155">해당 단계는 넘긴다</text>

<text x="100" y="790" font-size="22" fill="#4b5563">맞춤 규칙으로 더 엄격하게 하거나 덜 민감한 공유 범위를 넓힐 수 있지만, 필수 확인과 핵심 안전 요건은 없앨 수 없다.</text>
<text x="1500" y="860" text-anchor="end" font-size="18" fill="#94a3b8">BlueBWorks 도식</text>
</g>
</svg>
