<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GPT-6 Astra, GPT-6.1 Sol, Luna의 API 표준 가격 비교</title>
<desc id="desc">100만 토큰당 표준 가격. Astra 입력 10달러 출력 50달러 캐시 입력 1달러, Sol 입력 2달러 출력 10달러 캐시 입력 0.10달러, Luna 입력 0.10달러 출력 0.50달러 캐시 입력 0.01달러.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="100" y="92" font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif" font-size="42" font-weight="700" fill="#111827">GPT-6.1 Sol은 Astra 가격의 5분의 1</text>
<text x="100" y="138" font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#4b5563">OpenAI API 표준 가격, 100만 토큰당 미국 달러. 막대 길이는 출력 50달러를 기준으로 비례</text>
<g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="100" y="230" font-size="30" font-weight="700" fill="#334155">GPT-6 Astra</text>
<text x="100" y="275" font-size="21" fill="#64748b">입력</text><rect x="220" y="254" width="200" height="30" rx="6" fill="#64748b"/><text x="435" y="277" font-size="22" fill="#111827">$10.00</text>
<text x="100" y="320" font-size="21" fill="#64748b">출력</text><rect x="220" y="299" width="1000" height="30" rx="6" fill="#334155"/><text x="1235" y="322" font-size="22" fill="#111827">$50.00</text>
<text x="100" y="365" font-size="21" fill="#64748b">캐시 입력</text><rect x="220" y="344" width="20" height="30" rx="4" fill="#94a3b8"/><text x="255" y="367" font-size="22" fill="#111827">$1.00</text>

<text x="100" y="450" font-size="30" font-weight="700" fill="#1d4ed8">GPT-6.1 Sol</text>
<text x="100" y="495" font-size="21" fill="#64748b">입력</text><rect x="220" y="474" width="40" height="30" rx="6" fill="#3b82f6"/><text x="275" y="497" font-size="22" fill="#111827">$2.00</text>
<text x="100" y="540" font-size="21" fill="#64748b">출력</text><rect x="220" y="519" width="200" height="30" rx="6" fill="#1d4ed8"/><text x="435" y="542" font-size="22" fill="#111827">$10.00</text>
<text x="100" y="585" font-size="21" fill="#64748b">캐시 입력</text><rect x="220" y="564" width="4" height="30" rx="2" fill="#93c5fd"/><text x="240" y="587" font-size="22" fill="#111827">$0.10 (표준 입력보다 95% 낮음)</text>

<text x="100" y="670" font-size="30" font-weight="700" fill="#334155">Luna</text>
<text x="100" y="715" font-size="21" fill="#64748b">입력</text><rect x="220" y="694" width="3" height="30" rx="2" fill="#64748b"/><text x="240" y="717" font-size="22" fill="#111827">$0.10</text>
<text x="100" y="760" font-size="21" fill="#64748b">출력</text><rect x="220" y="739" width="10" height="30" rx="2" fill="#334155"/><text x="245" y="762" font-size="22" fill="#111827">$0.50 · 캐시 입력 $0.01</text>
<text x="100" y="840" font-size="21" fill="#4b5563">입력 272K 토큰을 넘는 요청, Fast·Ultrafast 모드, 지역 처리에는 별도 배율이 붙는다.</text>
<text x="1500" y="870" text-anchor="end" font-size="18" fill="#94a3b8">BlueBWorks 도식</text>
</g>
</svg>
