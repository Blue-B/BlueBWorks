<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="95" y="105" font-family="sans-serif" font-size="55" font-weight="700" fill="#0f172a">SGLang 분산 추론 서버 점검 순서</text><text x="95" y="160" font-family="sans-serif" font-size="25" fill="#475569">SGLang 팀 2026-10-26 권고사항을 바탕으로 재구성 · 환경별 적용 조건 확인</text><g font-family="sans-serif"><rect x="90" y="230" width="680" height="155" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="288" font-size="34" font-weight="700" fill="#1e40af">01  버전과 구성 확인</text><text x="125" y="338" font-size="25" fill="#1e3a8a">v0.5.22 이상 · Mooncake / NIXL / MORI</text><rect x="830" y="230" width="680" height="155" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="865" y="288" font-size="34" font-weight="700" fill="#166534">02  KV 풀 용량 대조</text><text x="865" y="338" font-size="25" fill="#14532d">실제 수용량 ≥ 설정 문맥 길이</text><rect x="90" y="420" width="680" height="155" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="125" y="478" font-size="34" font-weight="700" fill="#92400e">03  거부·중단 경로 테스트</text><text x="125" y="528" font-size="25" fill="#78350f">오류 전달 · 캐시 페이지 재사용 검사</text><rect x="830" y="420" width="680" height="155" rx="22" fill="#fce7f3" stroke="#db2777" stroke-width="3"/><text x="865" y="478" font-size="34" font-weight="700" fill="#9d174d">04  전송 완료 전 반납 금지</text><text x="865" y="528" font-size="25" fill="#831843">Deferred release · 확인 신호 점검</text><rect x="90" y="610" width="1420" height="165" rx="22" fill="#0f172a"/><text x="125" y="674" font-size="35" font-weight="700" fill="#ffffff">05  업그레이드 뒤 메트릭 확인</text><text x="125" y="730" font-size="27" fill="#e2e8f0">sglang:decode_deferred_kv_release_total{outcome} · drained / timeout 비율 점검</text></g><text x="1430" y="845" text-anchor="end" font-family="sans-serif" font-size="22" fill="#64748b">BlueBWorks · 자체 제작 점검 도식</text></svg>