<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>text{font-family:"Noto Sans CJK KR",sans-serif}</style><rect width="1600" height="900" fill="#f4f6f2"/><text x="85" y="112" font-size="48" font-weight="bold" fill="#153e36">연결 완료 ≠ 크레딧 발급 확인</text><text x="85" y="175" font-size="30" fill="#526158">신청 전 자격부터 확인하고, 마지막에 실제 잔액·만료일을 본다</text><rect x="85" y="280" width="332" height="330" fill="#ffffff" stroke="#b7cbbd" stroke-width="2"/><text x="110" y="343" font-size="34" fill="#526158">01</text><text x="110" y="415" font-size="37" font-weight="bold" fill="#153e36">자격 확인</text><text x="110" y="493" font-size="23" fill="#526158">적격 Pro·Business</text><text x="110" y="538" font-size="23" fill="#526158">유료 구독 7일 이상</text><rect x="451" y="280" width="332" height="330" fill="#ffffff" stroke="#b7cbbd" stroke-width="2"/><text x="476" y="343" font-size="34" fill="#526158">02</text><text x="476" y="415" font-size="37" font-weight="bold" fill="#153e36">조직 선택</text><text x="476" y="493" font-size="23" fill="#526158">같은 이메일 · 양쪽 소유자</text><text x="476" y="538" font-size="23" fill="#526158">받을 API 조직 확인</text><rect x="817" y="280" width="332" height="330" fill="#ffffff" stroke="#b7cbbd" stroke-width="2"/><text x="842" y="343" font-size="34" fill="#526158">03</text><text x="842" y="415" font-size="37" font-weight="bold" fill="#153e36">혜택 활성화</text><text x="842" y="493" font-size="23" fill="#526158">ChatGPT 또는 API</text><text x="842" y="538" font-size="23" fill="#526158">Billing에서 신청</text><rect x="1183" y="280" width="332" height="330" fill="#153e36" stroke="#b7cbbd" stroke-width="2"/><text x="1208" y="343" font-size="34" fill="#94dac0">04</text><text x="1208" y="415" font-size="37" font-weight="bold" fill="#ffffff">발급 검증</text><text x="1208" y="493" font-size="23" fill="#ffffff">API Credit grants</text><text x="1208" y="538" font-size="23" fill="#ffffff">금액과 만료일 확인</text><text x="85" y="707" font-size="34" fill="#153e36">첫 지급 일할 계산 · 결제 주기 끝에 만료 · 자동 이월 없음</text><text x="85" y="768" font-size="27" fill="#526158">구독만 있다고 지급된 것은 아님. 국가·활성화 대상 그룹에 따라 제공 여부가 다를 수 있음.</text><text x="85" y="849" font-size="23" fill="#526158">BlueBWorks 자체 도식 | OpenAI Developers 가이드 · 2026.10.29 확인</text></svg>