<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Chrome 154 반응형 iframe 동작 비교</title>
<desc id="desc">기존 postMessage 기반 높이 동기화와 Chrome 154의 frame-sizing 기반 콘텐츠 높이 계산 흐름을 비교한 BlueBWorks 도식</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="100" y="95" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#111827">iframe 높이 동기화, 무엇이 달라졌나</text>
<text x="100" y="145" font-family="Arial, sans-serif" font-size="24" fill="#4b5563">Chrome 154 · responsively-sized iframe</text>
<rect x="90" y="210" width="680" height="560" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
<text x="135" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#334155">기존 방식</text>
<rect x="150" y="330" width="560" height="130" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
<text x="190" y="385" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111827">iframe 내부 문서</text>
<text x="190" y="425" font-family="Arial, sans-serif" font-size="23" fill="#475569">scrollHeight 등을 직접 측정</text>
<path d="M430 470 L430 540" stroke="#64748b" stroke-width="5" marker-end="url(#arrowGray)"/>
<rect x="150" y="550" width="560" height="90" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
<text x="190" y="607" font-family="Arial, sans-serif" font-size="26" fill="#9a3412">postMessage({ height })</text>
<path d="M430 650 L430 700" stroke="#64748b" stroke-width="5" marker-end="url(#arrowGray)"/>
<text x="190" y="738" font-family="Arial, sans-serif" font-size="23" fill="#475569">부모 페이지가 iframe.style.height 갱신</text>

<rect x="830" y="210" width="680" height="560" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
<text x="875" y="270" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">Chrome 154</text>
<rect x="890" y="330" width="560" height="115" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
<text x="930" y="380" font-family="monospace" font-size="25" fill="#0f172a">frame-sizing: content-height;</text>
<text x="930" y="417" font-family="Arial, sans-serif" font-size="21" fill="#475569">부모 문서의 iframe CSS</text>
<path d="M1170 455 L1170 520" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
<rect x="890" y="530" width="560" height="115" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
<text x="930" y="577" font-family="monospace" font-size="21" fill="#0f172a">responsive-embedded-sizing</text>
<text x="930" y="615" font-family="Arial, sans-serif" font-size="21" fill="#475569">임베드 문서가 허용 origin을 명시</text>
<path d="M1170 655 L1170 705" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
<text x="930" y="744" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">브라우저가 콘텐츠 크기로 iframe을 계산</text>
<text x="100" y="835" font-family="Arial, sans-serif" font-size="22" fill="#64748b">BlueBWorks 도식 · Chrome for Developers 공식 동작 설명을 바탕으로 재구성</text>
<defs>
<marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
<marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
</defs>
</svg>