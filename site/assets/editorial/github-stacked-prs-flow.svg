<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GitHub Stacked Pull Requests의 브랜치와 PR 의존 관계</title>
<desc id="desc">main 위에 인증, API, 프런트엔드 변경을 각각 별도 브랜치와 풀 리퀘스트로 쌓고, 각 풀 리퀘스트가 바로 아래 브랜치를 base로 삼는 구조를 보여 주는 도식</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="100" y="105" font-family="Arial, Noto Sans KR, sans-serif" font-size="48" font-weight="700" fill="#111827">큰 변경을 하나의 PR이 아니라 의존 순서대로 쌓는다</text>
<text x="100" y="160" font-family="Arial, Noto Sans KR, sans-serif" font-size="26" fill="#4b5563">각 PR은 바로 아래 브랜치를 base로 삼아 자기 층의 diff만 보여 준다.</text>
<line x1="200" y1="700" x2="1370" y2="700" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<rect x="110" y="625" width="250" height="150" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<text x="235" y="680" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="34" font-weight="700" fill="#111827">main</text>
<text x="235" y="726" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="22" fill="#64748b">trunk</text>

<path d="M360 700 C430 700 430 560 500 560" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
<rect x="500" y="485" width="290" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="645" y="535" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">PR #1 · 인증 계층</text>
<text x="645" y="579" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" fill="#475569">base: main</text>

<path d="M790 560 C850 560 850 405 910 405" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
<rect x="910" y="330" width="290" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1055" y="380" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">PR #2 · API</text>
<text x="1055" y="424" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" fill="#475569">base: 인증 branch</text>

<path d="M1200 405 C1260 405 1260 250 1320 250" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
<rect x="1185" y="175" width="305" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="1337" y="225" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="27" font-weight="700" fill="#1e3a8a">PR #3 · 프런트엔드</text>
<text x="1337" y="269" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="21" fill="#475569">base: API branch</text>

<rect x="475" y="738" width="1010" height="72" rx="18" fill="#f8fafc"/>
<text x="980" y="782" text-anchor="middle" font-family="Arial, Noto Sans KR, sans-serif" font-size="24" fill="#334155">아래 변경에 의존하는 코드는 위에 둔다 · 리뷰는 각 층을 독립적으로 진행</text>
</svg>