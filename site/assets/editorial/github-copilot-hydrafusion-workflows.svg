<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">HydraFusion의 세 가지 실행 방식</title>
<desc id="desc">Single은 한 모델이 바로 해결한다. Cascade는 효율적인 모델이 초안을 만들고 품질 관문이 수락하거나 더 강한 모델로 올린다. Critique는 한 모델이 초안을 만들고 다른 모델 계열의 읽기 전용 비평자가 검토한 뒤 초안 모델이 한 번 고친다.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="80" y="92" font-size="40" font-weight="700" fill="#111827">HydraFusion은 요청마다 세 가지 실행 방식 중 하나를 고른다</text>
<text x="80" y="138" font-size="23" fill="#4b5563">GitHub Changelog(2026-09-30)와 Project HydraFusion 연구 글 기준</text>
<rect x="80" y="200" width="460" height="350" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<text x="106" y="252" font-size="28" font-weight="700" fill="#111827">Single</text>
<text x="106" y="305" font-size="22" fill="#334155">한 모델이 작업을 바로 해결</text>
<text x="106" y="345" font-size="22" fill="#334155"></text>
<text x="106" y="385" font-size="22" font-weight="700" fill="#111827">가장 빠르고 저렴</text>
<text x="106" y="425" font-size="22" fill="#334155">한 번에 풀 수 있는 작업</text>
<rect x="570" y="200" width="460" height="350" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
<text x="596" y="252" font-size="28" font-weight="700" fill="#1e3a8a">Cascade</text>
<text x="596" y="305" font-size="22" fill="#334155">① 효율적인 모델이 초안</text>
<text x="596" y="345" font-size="22" fill="#334155">② 품질 관문이 판단</text>
<text x="596" y="385" font-size="22" fill="#334155">③ 통과하면 수락,</text>
<text x="596" y="425" font-size="22" fill="#334155">    못 넘으면 더 강한 모델로</text>
<text x="596" y="465" font-size="22" fill="#334155"></text>
<text x="596" y="505" font-size="22" font-weight="700" fill="#1e3a8a">첫 시도는 싸게, 필요할 때만 승격</text>
<rect x="1060" y="200" width="460" height="350" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
<text x="1086" y="252" font-size="28" font-weight="700" fill="#92400e">Critique</text>
<text x="1086" y="305" font-size="22" fill="#334155">① 한 모델이 초안</text>
<text x="1086" y="345" font-size="22" fill="#334155">② 다른 모델 계열의</text>
<text x="1086" y="385" font-size="22" fill="#334155">    읽기 전용 비평자가 검토</text>
<text x="1086" y="425" font-size="22" fill="#334155">③ 초안 모델이 한 번 수정</text>
<text x="1086" y="465" font-size="22" fill="#334155"></text>
<text x="1086" y="505" font-size="22" font-weight="700" fill="#92400e">검토가 재시도보다 나은 작업</text>
<text x="80" y="620" font-size="21" fill="#4b5563">추가 모델 호출은 결과가 좋아질 가능성이 있을 때만 쓴다. 검토 단계는 도구 없는 격리 환경에서 실행돼 저장소를 바꾸지 않는다.</text>
<text x="1520" y="875" text-anchor="end" font-size="18" fill="#94a3b8">BlueBWorks 도식</text>
</g>
</svg>
