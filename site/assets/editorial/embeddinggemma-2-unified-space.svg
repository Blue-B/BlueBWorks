<text x="64" y="111" font-size="18" fill="#4b5563">EmbeddingGemma 2 · 공통 768차원 임베딩 공간</text>
<g fill="#f8fafc" stroke="#cbd5e1">
<rect x="64" y="165" width="190" height="62" rx="10"/><rect x="64" y="242" width="190" height="62" rx="10"/>
<rect x="64" y="319" width="190" height="62" rx="10"/><rect x="64" y="396" width="190" height="62" rx="10"/>
</g>
