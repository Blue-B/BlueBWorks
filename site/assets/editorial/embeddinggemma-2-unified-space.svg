<text x="545" y="397" text-anchor="middle" font-size="16" fill="#4b5563">필요한 인코더만 선택해 로드</text>
<path d="M728 310 H806" stroke="#2563eb" stroke-width="4"/><path d="M798 301 L815 310 L798 319" fill="none" stroke="#2563eb" stroke-width="4"/>
<rect x="830" y="190" width="306" height="240" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
