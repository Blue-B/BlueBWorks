<text x="983" y="270" text-anchor="middle" font-size="19" fill="#2563eb">768 dimensions</text>
<g fill="#dbeafe" stroke="#60a5fa"><circle cx="905" cy="327" r="18"/><circle cx="957" cy="306" r="13"/><circle cx="1005" cy="346" r="16"/><circle cx="1057" cy="316" r="12"/><circle cx="930" cy="377" r="12"/><circle cx="982" cy="386" r="18"/><circle cx="1042" cy="371" r="14"/></g>
<text x="983" y="416" text-anchor="middle" font-size="15" fill="#64748b">의미가 가까우면 가까운 좌표</text>
<rect x="132" y="520" width="936" height="92" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="600" y="554" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">이 벡터를 로컬에서 비교해</text>
<text x="600" y="588" text-anchor="middle" font-size="18" fill="#475569">미디어 검색 · 코드 검색 · RAG 검색 · 분류/라우팅에 사용</text>
</g></svg>