<text x="159" y="204">텍스트 · 코드</text><text x="159" y="281">이미지</text>
<text x="159" y="358">비디오 프레임</text><text x="159" y="435">오디오</text>
</g>
<g stroke="#2563eb" stroke-width="3" fill="none">
<path d="M270 196 H358 M270 273 H358 M270 350 H358 M270 427 H358"/>
<path d="M350 188 L365 196 L350 204 M350 265 L365 273 L350 281 M350 342 L365 350 L350 358 M350 419 L365 427 L350 435"/>
</g>
<rect x="380" y="175" width="330" height="270" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="545" y="220" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">EmbeddingGemma 2</text>
<text x="545" y="258" text-anchor="middle" font-size="18" fill="#111827">텍스트 기반 270M</text>
<line x1="430" y1="279" x2="660" y2="279" stroke="#bfdbfe"/>
<text x="545" y="315" text-anchor="middle" font-size="18" fill="#111827">+ 비전 인코더 170M</text>
