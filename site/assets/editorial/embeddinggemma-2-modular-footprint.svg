<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">EmbeddingGemma 2 인코더와 벡터 차원</title>
<desc id="desc">텍스트 전용 270M부터 전체 멀티모달 740M까지의 구성과 768, 512, 256, 128차원 출력의 저장 비율을 설명한다.</desc>
<rect width="1200" height="675" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="64" y="74" font-size="34" font-weight="700" fill="#111827">필요한 인코더만 불러오고, 벡터 크기도 고른다</text>
<text x="64" y="108" font-size="17" fill="#475569">모델 카드 기준 파라미터 구성과 MRL 출력 차원</text>
<text x="64" y="164" font-size="18" font-weight="700" fill="#111827">선택형 인코더</text>
<g>
<rect x="64" y="185" width="250" height="106" rx="14" fill="#eff6ff" stroke="#2563eb"/>
<rect x="330" y="185" width="250" height="106" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
<rect x="596" y="185" width="250" height="106" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
<rect x="862" y="185" width="274" height="106" rx="14" fill="#eff6ff" stroke="#2563eb"/>
</g>
<g text-anchor="middle" fill="#111827">
<text x="189" y="223" font-size="20" font-weight="700">텍스트 · 코드</text><text x="189" y="258" font-size="24" font-weight="700">270M</text>
<text x="455" y="223" font-size="20" font-weight="700">텍스트 + 비전</text><text x="455" y="258" font-size="24" font-weight="700">440M</text>
<text x="721" y="223" font-size="20" font-weight="700">텍스트 + 오디오</text><text x="721" y="258" font-size="24" font-weight="700">570M</text>
<text x="999" y="223" font-size="20" font-weight="700">전체 멀티모달</text><text x="999" y="258" font-size="24" font-weight="700">740M</text>
</g>
<text x="64" y="360" font-size="18" font-weight="700" fill="#111827">MRL 출력 차원</text>
<line x1="120" y1="432" x2="1080" y2="432" stroke="#cbd5e1" stroke-width="5"/>
<g>
<circle cx="160" cy="432" r="23" fill="#2563eb"/><circle cx="450" cy="432" r="23" fill="#3b82f6"/><circle cx="740" cy="432" r="23" fill="#60a5fa"/><circle cx="1040" cy="432" r="23" fill="#93c5fd"/>
</g>
<g text-anchor="middle" font-size="14" font-weight="700"><text x="160" y="439" fill="#fff">768</text><text x="450" y="439" fill="#fff">512</text><text x="740" y="439" fill="#0f172a">256</text><text x="1040" y="439" fill="#0f172a">128</text></g>
<g text-anchor="middle" font-size="17" fill="#111827"><text x="160" y="485">기준 1:1</text><text x="450" y="485">1.5배 절감</text><text x="740" y="485">3배 절감</text><text x="1040" y="485">6배 절감</text></g>
<rect x="64" y="535" width="1072" height="82" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
<text x="92" y="568" font-size="17" font-weight="700" fill="#9a3412">중요:</text>
<text x="157" y="568" font-size="17" fill="#7c2d12">128d는 멀티모달 품질 하락이 더 크다. 줄인 뒤 L2 정규화하고, 질의와 문서 차원을 맞춰야 한다.</text>
<text x="92" y="598" font-size="15" fill="#7c2d12">Google 모델 카드는 256d까지 품질 영향이 비교적 작다고 설명하며 실제 데이터 검증을 권장한다.</text>
</g></svg>