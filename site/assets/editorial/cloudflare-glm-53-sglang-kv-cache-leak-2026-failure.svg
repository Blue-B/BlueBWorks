<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><text x="100" y="110" fill="#0f172a" font-family="sans-serif" font-weight="700" font-size="56">GLM-5.3 KV 캐시 노출은 어떻게 발생했나</text><text x="100" y="168" fill="#475569" font-family="sans-serif" font-size="26">Cloudflare 2026-10-26 사고 보고서를 바탕으로 재구성한 개념도 · 실제 서버 화면 아님</text><rect x="90" y="235" width="390" height="280" rx="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="125" y="300" font-family="sans-serif" font-size="38" font-weight="700" fill="#075985">① 긴 입력</text><text x="125" y="363" font-family="sans-serif" font-size="27" fill="#0c4a6e">설정: 1,048,576 토큰</text><text x="125" y="408" font-family="sans-serif" font-size="27" fill="#0c4a6e">실제 KV 풀: 681,280</text><text x="125" y="463" font-family="sans-serif" font-size="26" fill="#be123c">풀이 부족해 요청 거부</text><path d="M490 375H560" stroke="#475569" stroke-width="8" stroke-linecap="round"/><path d="M550 357L578 375 550 393" fill="none" stroke="#475569" stroke-width="8"/><rect x="590" y="235" width="390" height="280" rx="26" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="625" y="300" font-family="sans-serif" font-size="38" font-weight="700" fill="#92400e">② Prefill</text><text x="625" y="363" font-family="sans-serif" font-size="27" fill="#78350f">거부 상태 전달 누락</text><text x="625" y="408" font-family="sans-serif" font-size="27" fill="#78350f">임시 1토큰만 기록</text><text x="625" y="463" font-family="sans-serif" font-size="26" fill="#be123c">전송 완료로 오인</text><path d="M990 375H1060" stroke="#475569" stroke-width="8" stroke-linecap="round"/><path d="M1050 357L1078 375 1050 393" fill="none" stroke="#475569" stroke-width="8"/><rect x="1090" y="235" width="420" height="280" rx="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1125" y="300" font-family="sans-serif" font-size="38" font-weight="700" fill="#991b1b">③ Decode</text><text x="1125" y="363" font-family="sans-serif" font-size="27" fill="#7f1d1d">이전 요청 페이지까지 읽음</text><text x="1125" y="408" font-family="sans-serif" font-size="27" fill="#7f1d1d">다른 고객 내용이 섞임</text><text x="1125" y="463" font-family="sans-serif" font-size="26" fill="#be123c">HTTP 200으로 반환 가능</text><rect x="100" y="600" width="1400" height="185" rx="24" fill="#0f172a"/><text x="145" y="664" font-family="sans-serif" font-size="31" font-weight="700" fill="#ffffff">문제의 핵심</text><text x="145" y="720" font-family="sans-serif" font-size="28" fill="#e2e8f0">거부된 요청이 분산 처리 경로를 통과했고, 새로 쓰지 않은 KV 페이지를 이전 요청의 것으로 읽었다.</text><text x="1430" y="849" text-anchor="end" font-family="sans-serif" font-size="22" fill="#64748b">BlueBWorks · 자체 제작 도식</text></svg>