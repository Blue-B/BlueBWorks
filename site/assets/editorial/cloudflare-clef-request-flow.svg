<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Cloudflare Clef 결정 모델의 요청과 응답 구조</title>
<desc id="desc">요청에는 판단할 내용인 state와 타입이 정해진 질문 questions를 넣는다. 질문 타입은 예/아니오 noul, 선택 choice, 단계 점수 score다. 응답 answers에는 질문 id마다 선택지별 확률이 들어 있어 코드가 바로 분기할 수 있다.</desc>
<rect width="1600" height="900" fill="#ffffff"/>
<g font-family="Arial, Noto Sans KR, Malgun Gothic, sans-serif">
<text x="80" y="92" font-size="40" font-weight="700" fill="#111827">Clef는 글을 쓰지 않고 선택지마다 확률을 돌려준다</text>
<text x="80" y="138" font-size="23" fill="#4b5563">Workers AI Clef 모델 문서와 Cloudflare 블로그(2026-10-01) 기준</text>
<rect x="80" y="200" width="433" height="350" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<text x="106" y="252" font-size="25" font-weight="700" fill="#111827">state (판단할 내용)</text>
<text x="106" y="305" font-size="22" fill="#334155">텍스트, JSON, 채팅 기록</text>
<text x="106" y="345" font-size="22" fill="#334155">이미지 최대 4장(PNG·JPEG·WebP)</text>
<text x="106" y="385" font-size="22" fill="#334155">Clef 컨텍스트 65,536 토큰</text>
<text x="106" y="425" font-size="22" fill="#334155"></text>
<text x="106" y="465" font-size="22" font-weight="700" fill="#111827">예: 결제가 1시간째 실패</text>
<line x1="521" y1="375" x2="561" y2="375" stroke="#64748b" stroke-width="5"/><path d="M557 363 L577 375 L557 387 Z" fill="#64748b"/>
<rect x="583" y="200" width="433" height="350" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
<text x="609" y="252" font-size="25" font-weight="700" fill="#1e3a8a">questions (1~64개)</text>
<text x="609" y="305" font-size="22" fill="#334155">noul: 예/아니오</text>
<text x="609" y="345" font-size="22" fill="#334155">  → 긴급한가?</text>
<text x="609" y="385" font-size="22" fill="#334155">choice: 선택지 중 하나</text>
<text x="609" y="425" font-size="22" fill="#334155">  → 결제·기술·영업 팀</text>
<text x="609" y="465" font-size="22" fill="#334155">score: 순서 있는 단계</text>
<text x="609" y="505" font-size="22" fill="#334155">  → 영향 없음~심각</text>
<line x1="1024" y1="375" x2="1064" y2="375" stroke="#64748b" stroke-width="5"/><path d="M1060 363 L1080 375 L1060 387 Z" fill="#64748b"/>
<rect x="1086" y="200" width="433" height="350" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
<text x="1112" y="252" font-size="25" font-weight="700" fill="#065f46">answers (확률)</text>
<text x="1112" y="305" font-size="22" fill="#334155">질문 id마다 답 하나</text>
<text x="1112" y="345" font-size="22" fill="#334155">선택지별 확률 포함</text>
<text x="1112" y="385" font-size="22" fill="#334155"></text>
<text x="1112" y="425" font-size="22" font-weight="700" fill="#065f46">코드가 바로 분기</text>
<text x="1112" y="465" font-size="22" fill="#334155">티켓 배정, 에스컬레이션,</text>
<text x="1112" y="505" font-size="22" fill="#334155">사람에게 넘기기</text>
<text x="80" y="620" font-size="21" fill="#4b5563">판단 단계는 토큰을 하나씩 생성하지 않는다. 입력을 한 번 읽은 뒤 유효한 선택지들을 병렬로 점수 매긴다.</text>
<text x="1520" y="875" text-anchor="end" font-size="18" fill="#94a3b8">BlueBWorks 도식</text>
</g>
</svg>
