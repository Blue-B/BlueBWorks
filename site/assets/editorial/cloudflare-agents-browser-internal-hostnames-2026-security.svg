<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fafd"/><text x="92" y="112" font-family="Noto Sans CJK KR,sans-serif" font-size="48" fill="#18334f">내부 주소라도 접근 범위와 요청 권한은 제한해야 한다</text><text x="92" y="167" font-family="Noto Sans CJK KR,sans-serif" font-size="27" fill="#647c96">개발 서버 미리보기 도입 전 점검할 네 가지</text><g font-family="Noto Sans CJK KR,sans-serif"><rect x="100" y="265" width="660" height="205" rx="28" fill="#e5efff" stroke="#a3bfe8" stroke-width="3"/><text x="145" y="342" font-size="34" fill="#17416f">1. target 값 검증</text><text x="145" y="399" font-size="26" fill="#4d6681">포트 범위 · 폴더 경로 제한</text><rect x="840" y="265" width="660" height="205" rx="28" fill="#e5efff" stroke="#a3bfe8" stroke-width="3"/><text x="885" y="342" font-size="34" fill="#17416f">2. 외부 사이트 접근 차단</text><text x="885" y="399" font-size="26" fill="#4d6681">allowedDomains: [] 검토</text><rect x="100" y="520" width="660" height="205" rx="28" fill="#e5efff" stroke="#a3bfe8" stroke-width="3"/><text x="145" y="597" font-size="34" fill="#17416f">3. 요청 출처 확인</text><text x="145" y="654" font-size="26" fill="#4d6681">상태 변경 API는 Origin 검사</text><rect x="840" y="520" width="660" height="205" rx="28" fill="#e5efff" stroke="#a3bfe8" stroke-width="3"/><text x="885" y="597" font-size="34" fill="#17416f">4. 프로토콜 제약 확인</text><text x="885" y="654" font-size="26" fill="#4d6681">HTTP 전용 · WebSocket 미지원</text></g><text x="1500" y="852" font-family="Noto Sans CJK KR,sans-serif" font-size="23" fill="#8193a6" text-anchor="end">BlueBWorks · 자체 제작</text></svg>