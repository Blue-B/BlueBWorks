<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
<title id="title">키 유출 발견 후의 대응 흐름</title><desc id="desc">노출 위치와 소유자를 확인하고, 위험도를 고려해 제공자 쪽 키를 회수하거나 교체한다. 서비스가 새 키로 작동하는지와 사용 기록을 확인한 뒤 GitHub 경고를 처리한다. 파일 삭제와 경고 종료는 키 폐기를 대신하지 않는다.</desc>
<rect width="900" height="800" fill="#f5f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,NanumGothic,Malgun Gothic,sans-serif" fill="#172331">
<text x="56" y="70" font-size="24" fill="#465873">공식 대응 문서를 바탕으로 한 설명 도식</text>
<text x="56" y="127" font-size="43" font-weight="700">키의 권한과 경고 상태는 별개다</text>
<path d="M97 244V665" fill="none" stroke="#b5c5dc" stroke-width="4"/>
<rect x="56" y="190" width="788" height="112" rx="8" fill="white" stroke="#d4dce8"/><circle cx="99" cy="238" r="24" fill="#2459db"/><text x="99" y="247" text-anchor="middle" font-size="28" font-weight="700" fill="white">1</text><text x="148" y="236" font-size="32" font-weight="700">노출 위치·담당자 확인</text><text x="148" y="273" font-size="22" fill="#465873">발견된 커밋, 키 종류, 사용하는 서비스를 파악한다.</text><rect x="56" y="325" width="788" height="112" rx="8" fill="white" stroke="#d4dce8"/><circle cx="99" cy="373" r="24" fill="#2459db"/><text x="99" y="382" text-anchor="middle" font-size="28" font-weight="700" fill="white">2</text><text x="148" y="371" font-size="32" font-weight="700">제공자 쪽 키 회수·교체</text><text x="148" y="408" font-size="22" fill="#465873">노출 위험과 서비스 중단 위험을 고려해 조치한다.</text><rect x="56" y="460" width="788" height="112" rx="8" fill="white" stroke="#d4dce8"/><circle cx="99" cy="508" r="24" fill="#2459db"/><text x="99" y="517" text-anchor="middle" font-size="28" font-weight="700" fill="white">3</text><text x="148" y="506" font-size="32" font-weight="700">서비스·사용 기록 확인</text><text x="148" y="543" font-size="22" fill="#465873">새 키의 적용 상태와 의심스러운 접근을 확인한다.</text><rect x="56" y="595" width="788" height="112" rx="8" fill="white" stroke="#d4dce8"/><circle cx="99" cy="643" r="24" fill="#2459db"/><text x="99" y="652" text-anchor="middle" font-size="28" font-weight="700" fill="white">4</text><text x="148" y="641" font-size="32" font-weight="700">노출 지점 정리·경고 처리</text><text x="148" y="678" font-size="22" fill="#465873">실제 조치가 끝난 뒤 사유와 대응 기록을 남긴다.</text><text x="56" y="758" font-size="23" fill="#465873">파일 삭제나 경고 종료만으로 기존 키의 권한이 없어지지는 않는다.</text></g></svg>
