<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PyLockPeek CLI preview</title>
  <desc id="desc">Actual example output summarizing a pylock.toml and highlighting one source-only package.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="70" y="70" width="1460" height="760" rx="24" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <circle cx="120" cy="118" r="12" fill="#ff7b72"/><circle cx="160" cy="118" r="12" fill="#d29922"/><circle cx="200" cy="118" r="12" fill="#3fb950"/>
  <text x="255" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#8b949e">pylockpeek — offline pylock.toml inspector</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="31">
    <text x="120" y="220" fill="#c9d1d9">$ python3 pylockpeek.py examples/pylock.toml</text>
    <text x="120" y="300" fill="#f0f6fc" font-weight="700">PyLockPeek: 3 package(s) | created-by=example-locker | source-only=1</text>
    <text x="120" y="410" fill="#3fb950">attrs</text><text x="470" y="410" fill="#c9d1d9">25.1.0</text><text x="800" y="410" fill="#c9d1d9">wheel:1, sdist</text>
    <text x="120" y="490" fill="#d29922">native-ext</text><text x="470" y="490" fill="#c9d1d9">2.0.0</text><text x="800" y="490" fill="#d29922">sdist</text>
    <text x="120" y="570" fill="#3fb950">workspace-helper</text><text x="470" y="570" fill="#c9d1d9">(unversioned)</text><text x="800" y="570" fill="#c9d1d9">directory</text>
    <text x="120" y="700" fill="#8b949e">--source-only → native-ext  2.0.0  sdist</text>
  </g>
</svg>
