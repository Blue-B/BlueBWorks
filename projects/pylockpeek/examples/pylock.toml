lock-version = "1.0"
created-by = "example-locker"
requires-python = ">=3.11"
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[packages]]
name = "attrs"
version = "25.1.0"
wheels = [{name = "attrs-25.1.0-py3-none-any.whl"}]
sdist = {name = "attrs-25.1.0.tar.gz"}

[[packages]]
name = "native-ext"
version = "2.0.0"
sdist = {name = "native-ext-2.0.0.tar.gz"}

[[packages]]
name = "workspace-helper"
directory = {path = "./workspace-helper"}
