<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TransitionGuard CLI preview</title>
  <desc id="desc">Actual example output showing a duplicate view-transition-name and React ViewTransition usage.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="70" y="70" width="1460" height="760" rx="24" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <circle cx="120" cy="118" r="12" fill="#ff7b72"/><circle cx="160" cy="118" r="12" fill="#d29922"/><circle cx="200" cy="118" r="12" fill="#3fb950"/>
  <text x="255" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#8b949e">transition-guard — offline View Transition preflight</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30">
    <text x="120" y="220" fill="#c9d1d9">$ python3 transition_guard.py examples</text>
    <text x="120" y="310" fill="#f0f6fc" font-weight="700">TransitionGuard: 3 file(s), 3 named declaration(s), 1 duplicate name(s)</text>
    <text x="120" y="400" fill="#ff7b72" font-weight="700">DUPLICATE card-image</text>
    <text x="165" y="465" fill="#c9d1d9">examples/cards.css:2</text>
    <text x="165" y="525" fill="#c9d1d9">examples/detail.css:2</text>
    <text x="120" y="640" fill="#58a6ff">React &lt;ViewTransition&gt;: 1</text>
    <text x="120" y="705" fill="#58a6ff">addTransitionType(): 1</text>
    <text x="120" y="785" fill="#8b949e">No network access · no API key · read-only scan</text>
  </g>
</svg>
